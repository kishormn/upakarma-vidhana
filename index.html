<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yajur Veda Upakarma Vidhana 2026</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #eae6df; }
        .transition-opacity-custom { transition: opacity 0.35s ease-in-out; }
    </style>
</head>
<body class="antialiased py-12 px-4 selection:bg-amber-100">

    <!-- CONFIGURATION DASHBOARD LAYOUT -->
    <div id="setupScreen" class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl border border-stone-200 overflow-hidden transition-opacity-custom opacity-100">
        <div class="bg-gradient-to-r from-amber-800 to-stone-800 p-6 text-center text-amber-100 border-b-4 border-amber-600">
            <p class="text-xs uppercase tracking-widest font-sans font-bold text-amber-400">Dravida Sri Vaishnava Sampradaya</p>
            <h1 class="text-2xl font-serif text-white mt-1">Upakarma Krama Generator</h1>
            <p class="text-xs italic text-amber-200/70 mt-0.5">Configure ritual configuration for the year 2026</p>
        </div>

        <div class="p-6 space-y-4 font-sans">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-1">Mantra Script</label>
                    <select id="langSelect" class="w-full border border-stone-200 rounded-xl p-2.5 bg-stone-50 text-sm outline-none focus:ring-2 focus:ring-amber-600/20 focus:border-amber-700 font-medium text-stone-800">
                        <option value="kannada">ಕನ್ನಡ (Kannada Script)</option>
                        <option value="english">English (Roman Translit.)</option>
                        <option value="sanskrit">संस्कृतम् (Devanagari Script)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-1">Current Location</label>
                    <select id="locationSelect" class="w-full border border-stone-200 rounded-xl p-2.5 bg-stone-50 text-sm outline-none focus:ring-2 focus:ring-amber-600/20 focus:border-amber-700 text-stone-800">
                        <option value="south">Bengaluru / Chennai / Mysuru (Dakṣiṇē)</option>
                        <option value="north">New Delhi / Mumbai / Kolkata (Uttarē)</option>
                        <option value="west">USA / Europe / Global West (Paścimē)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-1">Sampradaya Lineage</label>
                    <select id="sectSelect" class="w-full border border-stone-200 rounded-xl p-2.5 bg-stone-50 text-sm outline-none focus:ring-2 focus:ring-amber-600/20 focus:border-amber-700 text-stone-800">
                        <option value="vadakalai">Vadakalai (Sriman Narayana Prityartham)</option>
                        <option value="thenkalai">Thenkalai (Bhagavat Kainkarya Rupam)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-1">Calendar Tradition</label>
                    <select id="dateSelect" class="w-full border border-stone-200 rounded-xl p-2.5 bg-stone-50 text-sm outline-none focus:ring-2 focus:ring-amber-600/20 focus:border-amber-700 text-stone-800">
                        <option value="tn">Tamil Nadu Rule — Aug 27, 2026</option>
                        <option value="ka">KA / AP Desha Rule — Sep 25, 2026</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-1">Your Gotra</label>
                    <select id="gotraSelect" class="w-full border border-stone-200 rounded-xl p-2.5 bg-stone-50 text-sm outline-none focus:ring-2 focus:ring-amber-600/20 focus:border-amber-700 text-stone-800">
                        <option value="srivatsa">Srivatsa (ಶ್ರೀವತ್ಸ)</option>
                        <option value="bharadvaja">Bharadvaja (ಭಾರದ್ವಾಜ)</option>
                        <option value="kashyapa">Kashyapa (ಕಶ್ಯಪ)</option>
                        <option value="vadhula">Vadhula (ವಾಧೂಲ)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-1">Your Name (Sharma)</label>
                    <input id="sharmaInput" type="text" placeholder="e.g. Anantha" class="w-full border border-stone-200 rounded-xl p-2.5 bg-stone-50 text-sm outline-none focus:ring-2 focus:ring-amber-600/20 focus:border-amber-700 text-stone-800">
                </div>
            </div>

            <button onclick="executeTransition()" class="w-full mt-4 bg-amber-800 hover:bg-amber-900 text-white py-3 rounded-xl text-sm font-semibold tracking-wide shadow-md transition-all cursor-pointer">
                Generate Complete Krama
            </button>
        </div>
    </div>
        <!-- CONTAINER RENDER WINDOW -->
    <div id="ritualView" class="hidden opacity-0 transition-opacity-custom px-2"></div>

    <!-- Script Layer Injection Link -->
    <script src="data.js"></script>
    <script>
        function executeTransition() {
            const setup = document.getElementById('setupScreen');
            const ritual = document.getElementById('ritualView');
            
            const lang = document.getElementById('langSelect').value;
            const sect = document.getElementById('sectSelect').value;
            const regionDate = document.getElementById('dateSelect').value;
            const selectedGotra = document.getElementById('gotraSelect').value;
            const location = document.getElementById('locationSelect').value;
            const name = document.getElementById('sharmaInput').value.trim();

            // Fire markup compilation engine
            const generatedHtml = generateRitualMarkup(lang, sect, regionDate, selectedGotra, location, name);
            ritual.innerHTML = generatedHtml;

            // Execute polished cross-fade transition choreography
            setup.classList.add('opacity-0');
            setTimeout(() => {
                setup.classList.add('hidden');
                ritual.classList.remove('hidden');
                setTimeout(() => {
                    ritual.classList.remove('opacity-0');
                    ritual.classList.add('opacity-100');
                }, 50);
            }, 350);
        }
    </script>
</body>
</html>
